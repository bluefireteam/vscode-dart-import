name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Using Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./cmds/ci.sh
      - name: Run Tests (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: ./cmds/ci.sh
